<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coral Sky Eyewear</title>
<meta name="description" content="Coral Sky Eyewear: lentes de sol con protección UV 400 y envíos a todo el país.">
<meta name="theme-color" content="#F7EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coral Sky">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: on phones the app fills the screen; on wider screens it sits inside a phone frame next to a short note. Screens slide like native navigation. */
:root{
  --cream:#F7EFE4; --cream-2:#EFE3D3; --sand:#E4D2BA; --paper:#FFFBF5;
  --coral:#DD7357; --coral-2:#EC9C82; --coral-soft:#F7DCD0; --coral-deep:#B9573F;
  --gold:#A27D47; --gold-2:#C9A66E; --gold-soft:#EBDDC6;
  --ink:#2E2219; --ink-2:#6E5D4E; --ink-3:#A8998A; --line:#E6D8C6;
  --good:#4E9A6B; --bad:#C2453A;
  --f-serif:"Cormorant Garamond",Georgia,serif; --f-caps:"Cinzel","Cormorant Garamond",serif; --f-ui:"Jost",system-ui,-apple-system,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-variant-numeric:lining-nums;font-family:var(--f-ui);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:12px}

/* ---------- stage (desktop) ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:24px 16px;background:linear-gradient(180deg,#FBE4D6 0%,#F8EBDF 40%,#EFE1CE 100%)}
.note{max-width:320px;display:flex;flex-direction:column;gap:14px}
.note .wm{font-family:var(--f-caps);letter-spacing:.14em;color:#8A6A3D;font-size:26px}
.note h1{font-family:var(--f-serif);font-size:44px;line-height:1;font-weight:600}
.note p{color:var(--ink-2);line-height:1.55}
.note .qr{font-size:13px;color:var(--ink-3)}
.phone{position:relative;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;background:#17120E;padding:12px;box-shadow:0 0 0 2px #3a2f26,0 50px 90px -30px rgba(90,50,30,.5);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--cream);isolation:isolate}
.phone .notch{position:absolute;top:22px;left:50%;width:110px;height:32px;margin-left:-55px;border-radius:18px;background:#000;z-index:90}
.phone .screen{--top:46px;--bot:16px}
@media (max-width:860px){.note{display:none}}
@media (max-width:520px){
  .stage{display:block;padding:0;background:var(--cream)}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:none}
  .phone .notch{display:none}
  .screen{border-radius:0}
  .phone .screen{--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
}

/* ---------- screens ---------- */
#app{position:absolute;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;will-change:transform}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:calc(var(--top) + 8px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.has-tab .scroll{padding-bottom:calc(var(--bot) + 110px)}
.has-cta .scroll{padding-bottom:calc(var(--bot) + 120px)}
h1,h2,h3{font-family:var(--f-serif);font-weight:600;letter-spacing:-.01em;line-height:1.05}
.pad{padding:0 22px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{height:54px;border-radius:27px;background:var(--coral);color:#fff;font-weight:600;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 12px 24px -12px var(--coral-deep);transition:transform .15s,background .3s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.dark{background:var(--ink);box-shadow:0 12px 24px -12px rgba(46,34,25,.6)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ok{background:var(--good)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .ic{width:20px;height:20px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 4px 12px -6px rgba(90,60,30,.35);position:relative;flex:none;transition:transform .15s}
.ib:active{transform:scale(.9)}
.ib .ic{width:21px;height:21px}
.ib.on{color:var(--coral)}
.ib.on .ic{fill:currentColor}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--coral);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid var(--cream)}
.badge[data-n="0"]{display:none}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.35)}}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* splash */
.splash{align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 40%,#FBE6DA,var(--cream) 70%)}
.splash .mark{width:170px;height:170px;animation:in 1s cubic-bezier(.2,.8,.2,1) both}
.splash .wm{font-family:var(--f-caps);font-size:34px;letter-spacing:.12em;color:#8A6A3D;padding-left:.12em;animation:up .8s .3s both}
.splash .ew{font-size:12px;letter-spacing:.55em;color:var(--gold);margin-top:6px;padding-left:.55em;display:flex;gap:10px;align-items:center;animation:up .8s .45s both}
.splash .ew i{width:44px;height:1px;background:var(--gold)}
.splash .bar{position:absolute;bottom:calc(var(--bot) + 70px);width:90px;height:3px;border-radius:2px;background:var(--gold-soft);overflow:hidden}
.splash .bar i{display:block;height:100%;background:var(--coral);animation:load 1.5s ease-in-out both}
@keyframes load{from{width:0}to{width:100%}}
@keyframes in{from{opacity:0;transform:scale(.85)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}

/* onboarding */
.onb .track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-top:calc(var(--top) + 30px)}
.onb .track::-webkit-scrollbar{display:none}
.onb .slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 30px;gap:14px}
.arch{width:min(280px,72vw);aspect-ratio:300/360;border-radius:150px 150px 26px 26px;position:relative;overflow:hidden}
.arch.a1{background:linear-gradient(180deg,#F6CDBE,#F3E0D1)}
.arch.a2{background:linear-gradient(180deg,#F8D9A8,#F4E6D2)}
.arch.a3{background:linear-gradient(180deg,#CFE3DD,#F1E8DB)}
.arch svg{position:absolute;inset:0;width:100%;height:100%}
.onb h2{font-size:34px;margin-top:12px}
.onb p{font-size:15.5px;line-height:1.5;color:var(--ink-2);max-width:300px}
.dots{display:flex;gap:8px;justify-content:center;margin:16px 0 20px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--sand);transition:all .4s}
.dots i.on{width:26px;background:var(--coral)}
.onb .foot{display:flex;gap:14px;align-items:center;padding:0 22px calc(var(--bot) + 28px)}
.onb .skip{font-size:15px;color:var(--ink-2);font-weight:500;width:80px;text-align:left}

/* auth */
.auth .top{height:220px;position:relative;margin-top:calc(-1 * (var(--top) + 8px));overflow:hidden}
.auth .top svg{position:absolute;inset:0;width:100%;height:100%}
.auth h1{font-size:38px}
.lead{font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.form{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2);letter-spacing:.02em}
.field .box{height:52px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;transition:box-shadow .25s}
.field .box .ic{width:19px;height:19px;color:var(--ink-3)}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;height:100%}
.field input::placeholder{color:var(--ink-3)}
.field .box:focus-within{box-shadow:inset 0 0 0 2px var(--coral),0 0 0 4px var(--coral-soft)}
.field.err .box{box-shadow:inset 0 0 0 2px var(--bad)}
.field .msg{font-size:12px;color:var(--bad);display:none}
.field.err .msg{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.check{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2);text-align:left}
.check .cb{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--ink-3);display:grid;place-items:center;flex:none;transition:all .25s}
.check .cb .ic{width:14px;height:14px;opacity:0;stroke:#fff;stroke-width:3}
.check.on .cb{background:var(--coral);box-shadow:none}
.check.on .cb .ic{opacity:1}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.socials{display:flex;gap:12px}
.socials .btn{font-size:14.5px}
.socials svg{width:19px;height:19px}
.foot-link{text-align:center;font-size:14.5px;color:var(--ink-2);margin:18px 0 30px}
.foot-link button{color:var(--coral);font-weight:600}

/* headers */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 22px 0}
.hdr .who{flex:1;min-width:0}
.hdr .who small{display:block;font-size:13px;color:var(--ink-2)}
.hdr .who h1{font-size:32px}
.bar{display:flex;align-items:center;gap:12px;padding:4px 22px 0}
.bar h1{flex:1;font-size:30px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .meta{font-size:13px;color:var(--ink-3)}

/* home */
.search{margin:16px 22px 0;height:50px;border-radius:25px;background:var(--paper);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--ink-3);font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line)}
.search .ic{width:19px;height:19px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.promo{display:block;width:calc(100% - 44px);text-align:left;margin:18px 22px 0;height:170px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(120deg,#E58467,#F0AE8E 60%,#F6CDB0);color:#fff;padding:20px}
.promo .kick{font-size:11px;letter-spacing:.24em;font-weight:500;opacity:.92}
.promo h2{font-size:31px;margin-top:6px;color:#fff;max-width:56%}
.promo .chip{display:inline-flex;margin-top:12px;height:30px;padding:0 13px;border-radius:15px;background:rgba(255,255,255,.95);color:var(--coral-deep);font-size:12.5px;font-weight:600;align-items:center}
.promo svg.pg{position:absolute;right:-28px;bottom:8px;width:220px;transform:rotate(-10deg);filter:drop-shadow(0 10px 10px rgba(120,50,30,.35))}
.promo svg.pl{position:absolute;right:0;top:0;width:150px;height:170px;opacity:.5}
.cats{display:flex;gap:12px;padding:20px 22px 0}
.cat{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.cat .t{width:100%;aspect-ratio:1;border-radius:22px;background:var(--paper);display:grid;place-items:center;box-shadow:0 6px 16px -10px rgba(90,60,30,.45);transition:transform .15s}
.cat:active .t{transform:scale(.92)}
.cat .t svg{width:72%}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:22px 22px 12px}
.sec h2{font-size:26px}
.sec button{font-size:13px;color:var(--coral);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 22px}
.card{background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:0 8px 20px -14px rgba(90,60,30,.5);transition:transform .15s;text-align:left;position:relative;min-width:0}
.card:active{transform:scale(.97)}
.card .im{height:128px;position:relative;display:grid;place-items:center}
.card .im svg.g{width:86%}
.card .fav{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:50%;background:rgba(255,251,245,.9);display:grid;place-items:center;color:var(--ink-2)}
.card .fav .ic{width:16px;height:16px}
.card .fav.on{color:var(--coral)}
.card .fav.on .ic{fill:currentColor}
.sold{position:absolute;left:9px;top:9px;font-size:9.5px;letter-spacing:.12em;font-weight:600;color:#fff;background:var(--ink);padding:4px 8px;border-radius:8px}
.new{position:absolute;left:9px;top:9px;font-size:9.5px;letter-spacing:.12em;font-weight:600;color:#fff;background:var(--coral);padding:4px 8px;border-radius:8px}
.card .bd{padding:10px 13px 13px}
.card .nm{font-family:var(--f-serif);font-size:21px;font-weight:600;line-height:1}
.card .tg{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.card .pr{font-weight:600;font-size:14.5px;margin-top:8px}
.card .add{position:absolute;right:11px;bottom:11px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transition:background .3s,transform .15s}
.card .add .ic{width:16px;height:16px}
.card .add:active{transform:scale(.85)}
.card .add.ok{background:var(--good)}

/* list */
.chips{display:flex;gap:8px;padding:16px 22px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{height:36px;padding:0 16px;border-radius:18px;font-size:14px;font-weight:500;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);transition:all .3s;white-space:nowrap;flex:none}
.chips button.on{background:var(--ink);color:#fff;box-shadow:none}
.tools{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 12px}
.count{font-size:13px;color:var(--ink-3)}
.sort{border:0;background:transparent;font-size:13px;font-weight:500;color:var(--ink-2);outline:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:50px 32px}
.empty svg.g{width:170px;opacity:.85}
.empty h2{font-size:28px;margin-top:6px}
.empty p{color:var(--ink-2);font-size:14.5px;line-height:1.5;margin-bottom:8px}
.empty .btn{width:auto;padding:0 26px}

/* product */
.pd .scroll{padding-top:0}
.pd .hero2{height:calc(var(--top) + 340px);position:relative;overflow:hidden}
.pd .bgarch{position:absolute;left:50%;top:calc(var(--top) + 50px);width:270px;height:320px;margin-left:-135px;border-radius:135px 135px 0 0}
.pd .ptrack{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pd .ptrack::-webkit-scrollbar{display:none}
.pd .pslide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:calc(var(--top) + 80px) 34px 40px}
.pd .pslide svg{width:100%;filter:drop-shadow(0 22px 16px rgba(90,50,30,.28))}
.pd .float{position:absolute;top:calc(var(--top) + 8px);left:18px;right:18px;display:flex;gap:10px;z-index:5}
.pd .float .sp{flex:1}
.pdots{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.pdots i{width:6px;height:6px;border-radius:3px;background:rgba(46,34,25,.25);transition:all .4s}
.pdots i.on{width:20px;background:var(--ink)}
.pd .sheet{background:var(--paper);border-radius:30px 30px 0 0;margin-top:-22px;position:relative;padding:24px 22px 20px;display:flex;flex-direction:column;gap:12px;min-height:60%}
.pd .sheet h1{font-size:40px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stars{display:flex;gap:3px;align-items:center;font-size:13px;color:var(--ink-2)}
.stars svg{width:15px;height:15px;fill:var(--gold-2)}
.pd .price{font-family:var(--f-serif);font-size:30px;font-weight:700;white-space:nowrap}
.lbl{font-size:13px;color:var(--ink-2)}
.lbl b{color:var(--ink);font-weight:600}
.sw{display:flex;gap:12px}
.sw button{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--paper),0 0 0 1.5px var(--line);transition:box-shadow .3s}
.sw button.on{box-shadow:inset 0 0 0 3px var(--paper),0 0 0 2px var(--ink)}
.feats{display:flex;gap:10px}
.feats div{flex:1;border-radius:16px;background:var(--cream);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2);text-align:center}
.feats .ic{color:var(--coral)}
.desc{font-size:14px;line-height:1.55;color:var(--ink-2)}
.cta{position:absolute;left:0;right:0;bottom:0;padding:14px 22px calc(var(--bot) + 18px);background:linear-gradient(180deg,rgba(255,251,245,0),var(--paper) 30%);display:flex;gap:12px;align-items:center;z-index:10}
.cta.cream{background:linear-gradient(180deg,rgba(247,239,228,0),var(--cream) 35%)}
.qty{height:54px;border-radius:27px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;flex:none;background:var(--paper)}
.qty button{width:42px;height:54px;display:grid;place-items:center;font-size:22px;color:var(--ink-2)}
.qty b{min-width:20px;text-align:center;font-size:17px}

/* cart */
.items{display:flex;flex-direction:column;gap:12px;padding:16px 22px 0}
.item{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:22px;padding:12px;box-shadow:0 8px 20px -16px rgba(90,60,30,.5);transition:opacity .3s,transform .3s}
.item .th{width:80px;height:80px;border-radius:18px;display:grid;place-items:center;flex:none}
.item .th svg{width:88%}
.item .in{flex:1;min-width:0}
.item .in b{font-family:var(--f-serif);font-size:21px;font-weight:600;display:block;line-height:1}
.item .in small{font-size:12px;color:var(--ink-3);display:block;margin-top:3px}
.item .in .pr{font-weight:600;font-size:15px;margin-top:6px}
.item .q{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.item .q button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:17px}
.coupon{margin:16px 22px 0;display:flex;gap:10px;align-items:flex-start}
.coupon .field{flex:1}
.coupon .ap{height:52px;padding:0 20px;border-radius:16px;background:var(--ink);color:#fff;font-weight:600;font-size:14.5px;transition:background .3s}
.coupon .ap.ok{background:var(--good)}
.sum{margin:16px 22px 0;background:var(--paper);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.sum .r{display:flex;justify-content:space-between;color:var(--ink-2)}
.sum .r.disc{color:var(--good);font-weight:600}
.sum .r.tot{color:var(--ink);font-weight:600;font-size:18px;padding-top:10px;border-top:1px dashed var(--line);align-items:baseline}
.sum .r.tot span:last-child{font-family:var(--f-serif);font-size:26px;font-weight:700}
.free{color:var(--good);font-weight:600}
.hint{font-size:12.5px;color:var(--ink-3);margin:10px 22px 0;text-align:center}

/* checkout */
.blk{margin:18px 22px 0}
.blk h3{font-family:var(--f-ui);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:10px}
.blk .form{margin-top:0}
.ccard{height:170px;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#2E2219,#5A4130 60%,#8A6A3D);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 30px -18px rgba(46,34,25,.8);margin-bottom:12px}
.ccard .mk{width:44px;height:44px}
.ccard .no{font-size:18px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.ccard .bt{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;opacity:.85;text-transform:uppercase}
.ccard .no,.ccard .bt,.ccard .mk{position:relative}
.ccard .sunc{position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#EC9C82,#DD7357);opacity:.5}
.pm{display:flex;flex-direction:column;gap:10px}
.pm .o{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:14px 16px;font-size:15px;transition:box-shadow .3s;text-align:left;width:100%}
.pm .o .rd{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3);transition:all .3s;flex:none}
.pm .o.on{box-shadow:inset 0 0 0 2px var(--coral)}
.pm .o.on .rd{box-shadow:inset 0 0 0 7px var(--coral)}
.pm .o small{margin-left:auto;color:var(--ink-3);font-size:12.5px}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.3,.8,.2,1)}
.expand>div{overflow:hidden}
.expand.open{grid-template-rows:1fr}
.expand .inner{padding-top:12px}
.bank{background:var(--paper);border-radius:18px;padding:14px 16px;font-size:14px;color:var(--ink-2);line-height:1.6}
.bank b{color:var(--ink)}
.demo{font-size:12px;color:var(--ink-3);text-align:center;margin-top:8px}

/* success + tracking */
.okscr{align-items:center;text-align:center;padding:0 30px;justify-content:center;gap:12px;background:radial-gradient(90% 60% at 50% 40%,#FBE6DA,var(--cream) 70%)}
.okscr .ring{width:120px;height:120px}
.okscr .ring circle{stroke-dasharray:380;stroke-dashoffset:380;animation:draw 1s .1s cubic-bezier(.3,.8,.2,1) forwards}
.okscr .ring path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.okscr h1{font-size:42px}
.okscr p{font-size:15.5px;color:var(--ink-2);line-height:1.5}
.ord{font-family:var(--f-caps);font-size:14px;letter-spacing:.14em;color:var(--gold)}
.okscr .btn{margin-top:12px}
.conf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;z-index:45;pointer-events:none}
.map{margin:12px 22px 0;height:230px;border-radius:26px;overflow:hidden;position:relative;background:#F1E4D2}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.truck{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -6px rgba(46,34,25,.6);transition:left 1.2s cubic-bezier(.3,.8,.2,1),top 1.2s cubic-bezier(.3,.8,.2,1)}
.truck .ic{width:22px;height:22px}
.tl{margin:16px 22px 0;background:var(--paper);border-radius:24px;padding:18px}
.tl .s{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl .s:last-child{padding-bottom:0}
.tl .s .b{width:28px;height:28px;border-radius:50%;background:var(--cream-2);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.tl .s .b .ic{width:15px;height:15px;stroke:#fff;stroke-width:3;opacity:0}
.tl .s.done .b{background:var(--coral)}
.tl .s.done .b .ic{opacity:1}
.tl .s.now .b{background:var(--paper);box-shadow:inset 0 0 0 2.5px var(--coral)}
.tl .s.now .b::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
.tl .s:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--cream-2)}
.tl .s.done:not(:last-child)::before{background:var(--coral)}
.tl .s b{font-size:15px;display:block;font-weight:600}
.tl .s small{font-size:12.5px;color:var(--ink-3)}

/* orders */
.olist{display:flex;flex-direction:column;gap:12px;padding:16px 22px 0}
.oc{background:var(--paper);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;box-shadow:0 8px 20px -16px rgba(90,60,30,.5)}
.oc .th{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none}
.oc .th svg{width:90%}
.oc .in{flex:1;min-width:0}
.oc .in b{display:block;font-family:var(--f-caps);font-size:13px;letter-spacing:.1em;color:var(--gold)}
.oc .in span{display:block;font-size:14.5px;font-weight:500;margin-top:2px}
.oc .in small{color:var(--ink-3);font-size:12.5px}
.pill{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--coral-soft);color:var(--coral-deep);white-space:nowrap}
.pill.g{background:#E2F0E6;color:var(--good)}

/* profile */
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 22px 0;text-align:center}
.prof .av{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--coral-2),var(--coral));color:#fff;display:grid;place-items:center;font-family:var(--f-serif);font-size:38px;font-weight:600;box-shadow:0 0 0 5px var(--paper)}
.prof h1{font-size:32px;margin-top:8px}
.prof small{color:var(--ink-2);font-size:14px}
.stats{display:flex;margin:18px 22px 0;background:var(--paper);border-radius:22px;padding:14px 0}
.stats div{flex:1;text-align:center;font-size:12.5px;color:var(--ink-2)}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--f-serif);font-size:26px;color:var(--ink)}
.menu{margin:16px 22px 0;background:var(--paper);border-radius:22px;overflow:hidden}
.menu .m{display:flex;align-items:center;gap:14px;padding:15px 18px;font-size:15px;transition:background .2s;width:100%;text-align:left}
.menu .m:active{background:var(--cream)}
.menu .m+.m{border-top:1px solid var(--cream-2)}
.menu .m .ic{width:21px;height:21px;color:var(--coral)}
.menu .m .ch{margin-left:auto;color:var(--ink-3);width:17px;height:17px}
.menu .m small{margin-left:auto;color:var(--ink-3);font-size:13px}
.menu .m small+.ch{margin-left:6px}
.menu .m.out{color:var(--coral-deep);font-weight:500}
.ver{text-align:center;font-size:12px;color:var(--ink-3);margin:20px 0 0}
.faq{margin:16px 22px 0;display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--paper);border-radius:18px;padding:14px 16px}
.faq summary{font-weight:500;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";color:var(--coral);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{font-size:14px;color:var(--ink-2);line-height:1.55;margin-top:8px}

/* tab bar */
.tabbar{position:absolute;left:14px;right:14px;bottom:calc(var(--bot) + 12px);height:64px;border-radius:32px;background:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:20;box-shadow:0 18px 30px -16px rgba(46,34,25,.7)}
.tabbar button{display:grid;place-items:center;color:rgba(255,251,245,.55);height:64px;position:relative;z-index:1;transition:color .3s}
.tabbar button .ic{width:23px;height:23px}
.tabbar button.on{color:var(--ink)}
.tabbar .pill2{position:absolute;top:8px;left:6px;width:calc(25% - 12px);height:48px;border-radius:24px;background:var(--cream);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--bot) + 92px);z-index:80;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:18px;background:var(--ink);color:var(--paper);font-size:14px;box-shadow:0 20px 40px -16px rgba(46,34,25,.6)}
.toast .ic{width:20px;height:20px;color:#9FD4B0}
.toast span{flex:1}
.toast button{color:var(--coral-2);font-weight:600}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

/* ---------- router ---------- */
const app = $('#app');
let cur = null, depth = 0;
const TAB_ROUTES = ['home','shop','favs','profile'];
function parse(h){
  const [path, qs] = (h.replace(/^#\/?/, '') || 'home').split('?');
  const [name, id] = path.split('/');
  const map = {p:'product'};
  return {name: map[name] || name, id: id && decodeURIComponent(id), q: Object.fromEntries(new URLSearchParams(qs || ''))};
}
function nav(to, replace){
  const h = '#/' + to;
  if (replace) history.replaceState({d:depth}, '', h); else history.pushState({d:++depth}, '', h);
  render(replace ? 'fade' : 'push');
}
addEventListener('popstate', e => { const d = e.state?.d ?? 0; const dir = d < depth ? 'pop' : 'push'; depth = d; render(dir); });

function render(how = 'fade'){
  const r = parse(location.hash);
  const fn = SCREENS[r.name] || SCREENS.notfound;
  const tpl = document.createElement('template');
  tpl.innerHTML = fn(r.q, r.id).trim();
  const el = tpl.content.firstElementChild;
  const prev = cur;
  const tabSwap = prev && TAB_ROUTES.includes(r.name) && TAB_ROUTES.includes(prev.dataset.route);
  el.dataset.route = r.name;
  app.appendChild(el);
  cur = el;
  wire(el, r);
  if (prev && !reduce){
    const o = {duration:420, easing:'cubic-bezier(.32,.72,0,1)', fill:'both'};
    if (how === 'fade' || tabSwap){
      el.animate([{opacity:0},{opacity:1}], {...o, duration:220});
      setTimeout(() => prev.remove(), 220);
    } else if (how === 'pop'){
      app.insertBefore(el, prev);
      el.animate([{transform:'translateX(-30%)'},{transform:'none'}], o);
      prev.animate([{transform:'none'},{transform:'translateX(100%)'}], o).finished.then(() => prev.remove());
    } else {
      prev.animate([{transform:'none'},{transform:'translateX(-30%)'}], o);
      el.animate([{transform:'translateX(100%)'},{transform:'none'}], o).finished.then(() => prev.remove());
    }
  } else if (prev) prev.remove();
}

/* ---------- interactions ---------- */
function toast(msg, action){
  $$('.toast', app).forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = `${I.check}<span>${msg}</span>${action ? `<button>${action[0]}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.remove(); action[1](); };
  cur.appendChild(t);
  t.animate([{transform:'translateY(30px)',opacity:0},{transform:'none',opacity:1}], {duration:350, easing:'cubic-bezier(.3,1.3,.5,1)'});
  setTimeout(() => t.animate([{opacity:1},{opacity:0}], {duration:250, fill:'forwards'}).finished.then(() => t.remove()), 2600);
}
function refreshBadges(){ $$('.cartbtn .badge').forEach(b => { b.dataset.n = cartN(); b.textContent = cartN(); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }); }
function addToCart(id, v = 0, q = 1){
  const p = byId(id); if (!p || p.sold) return;
  const it = S.cart.find(i => i.id === id && i.v === v);
  if (it) it.q += q; else S.cart.push({id, v, q});

  toast(`${p.name} · ${p.v[v].n} en tu carrito`, ['Ver', () => nav('cart')]);
}
function toggleFav(id, btn){
  const on = !isFav(id);

  if (cur.dataset.route === 'favs' && !on) setTimeout(() => render('fade'), 250);
}
function burst(x, y, host){
  if (reduce) return;
  const r = host.getBoundingClientRect();
  for (let i = 0; i < 10; i++){
    const d = document.createElement('i');
    d.style.cssText = `position:absolute;left:${x-r.left}px;top:${y-r.top}px;width:6px;height:6px;border-radius:50%;background:${i%2?'#EC9C82':'#DD7357'};pointer-events:none;z-index:60`;
    host.appendChild(d);
    const a = Math.PI*2*i/10, dist = 30 + Math.random()*20;
    d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*dist}px), calc(-50% + ${Math.sin(a)*dist}px)) scale(.3)`,opacity:0}], {duration:600, easing:'cubic-bezier(.2,.8,.2,1)'}).finished.then(() => d.remove());
  }
}
function confetti(host){
  if (reduce) return;
  const cols = ['#DD7357','#EC9C82','#C9A66E','#8FBDB5','#F2B860'];
  for (let i = 0; i < 46; i++){
    const c = document.createElement('i');
    c.className = 'conf';
    c.style.left = Math.random()*100 + '%';
    c.style.background = cols[i % cols.length];
    host.appendChild(c);
    c.animate([{transform:`translateY(0) rotate(0)`},{transform:`translateY(${host.clientHeight + 40}px) rotate(${Math.random()*720-360}deg) translateX(${Math.random()*80-40}px)`}], {duration:1800 + Math.random()*1400, delay:Math.random()*400, easing:'cubic-bezier(.3,.6,.5,1)', fill:'forwards'}).finished.then(() => c.remove());
  }
}
function setErr(form, id, bad){ const f = $(`[data-f="${id}"]`, form); f?.classList.toggle('err', !!bad); return !bad; }

function wire(el, r){
  // global taps inside this screen
  el.addEventListener('click', e => {
    const fav = e.target.closest('[data-fav]');
    if (fav){ e.stopPropagation(); toggleFav(fav.dataset.fav, fav); return; }
    const quick = e.target.closest('[data-quick]');
    if (quick){ e.stopPropagation(); addToCart(quick.dataset.quick); quick.classList.add('ok'); quick.innerHTML = I.check; burst(e.clientX, e.clientY, el); setTimeout(() => { quick.classList.remove('ok'); quick.innerHTML = I.plus; }, 1400); return; }
    if (e.target.closest('[data-back]')){ history.length > 1 && depth > 0 ? history.back() : nav('home', true); return; }
    const go = e.target.closest('[data-go]');
    if (go){ e.preventDefault(); nav(go.dataset.go, go.hasAttribute('data-replace') || (TAB_ROUTES.includes(go.dataset.go) && go.closest('.tabbar'))); }
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.card')) e.target.click(); });
  const sc = $('.scroll', el);
  const on = SETUP[r.name]; if (on) on(el, r);
  if (sc && r.name !== 'product') sc.scrollTop = 0;
}

      }
    });
    const f = $('#cpF', el);
    f.onsubmit = e => {
      e.preventDefault();
      if (S.coupon){ S.coupon = null; save(); render('fade'); return; }
      const c = $('#cpn', f).value.trim().toUpperCase();
      if (!COUPONS[c]){ setErr(f, 'cpn', true); return; }
      S.coupon = c; save(); render('fade'); setTimeout(() => toast(`Cupón ${c} aplicado`), 240);
    };
  },
  checkout(el){
    if (!S.cart.length) return;
    const f = $('#payF', el); let pm = 'card';
    $$('#pm .o', el).forEach(o => o.onclick = () => {
      pm = o.dataset.pm;
      $$('#pm .o', el).forEach(x => x.classList.toggle('on', x === o));
      $('#cardX', el).classList.toggle('open', pm === 'card');
      $('#trX', el).classList.toggle('open', pm === 'transfer');
    });
    const num = $('#cnum', el), exp = $('#cexp', el), nm = $('#aname', el);
    num.oninput = () => { const d = digits(num.value).slice(0,16); num.value = d.replace(/(.{4})/g,'$1 ').trim(); $('#ccNo', el).textContent = (d + '•'.repeat(16 - d.length)).replace(/(.{4})/g,'$1 ').trim(); };
    exp.oninput = () => { let d = digits(exp.value).slice(0,4); exp.value = d.length > 2 ? d.slice(0,2) + '/' + d.slice(2) : d; $('#ccExp', el).textContent = exp.value || 'MM/AA'; };
    nm.addEventListener('input', () => { $('#ccName', el).textContent = nm.value || 'TU NOMBRE'; });
    f.onsubmit = async e => {
      e.preventDefault();
      const a = {name:nm.value.trim(), phone:digits($('#aphone', f).value), street:$('#astreet', f).value.trim(), city:$('#acity', f).value};
      let ok = [setErr(f,'aname',a.name.length < 2), setErr(f,'aphone',a.phone.length !== 10), setErr(f,'astreet',a.street.length < 4), setErr(f,'acity',!a.city)].every(Boolean);
      if (pm === 'card'){
        const [mm, yy] = exp.value.split('/').map(Number);
        ok = [setErr(f,'cnum',digits(num.value).length < 15), setErr(f,'cexp',!(mm >= 1 && mm <= 12 && yy >= 26)), setErr(f,'ccvc',!/^\d{3,4}$/.test($('#ccvc', f).value))].every(Boolean) && ok;
      }
      if (!ok){ const bad = $('.field.err', f); bad?.scrollIntoView({behavior:'smooth', block:'center'}); bad?.querySelector('input,select')?.focus({preventScroll:true}); return; }
      const b = $('#payBtn', el); b.disabled = true; b.innerHTML = '<span class="spin"></span>Procesando…';
      await sleep(1400);
      const id = 'CS-' + (1048 + S.orders.length + Math.floor(Math.random()*9));
      S.orders.unshift({id, at:Date.now(), items:S.cart.map(i => ({...i})), total:total(), pm, pmName:{card:'Tarjeta •••• ' + digits(num.value).slice(-4), transfer:'Transferencia', cod:'Contra entrega'}[pm], addr:a});
      S.addr = a; S.cart = []; S.coupon = null; save();
      nav('ok/' + id, true);
    };
  },
  ok(el){ setTimeout(() => confetti(el), 300); },
  track(el, r){
    const o = S.orders.find(o => o.id === r.id); if (!o) return;
    const step = orderStep(o);
    const t = setInterval(() => { if (!el.isConnected) return clearInterval(t); if (orderStep(o) !== step){ clearInterval(t); render('fade'); } }, 5000);
  },
  profile(el){
    $('#logout', el)?.addEventListener('click', () => { S.user = null; save(); nav('login', true); });
    $('#reset', el).onclick = e => { const b = e.currentTarget; if (!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Toca otra vez para borrar carrito, pedidos y cuenta'; return; } try { localStorage.removeItem(KEY); } catch {} Object.assign(S, {cart:[], favs:['palmera'], coupon:null, user:null, orders:[], seen:false, addr:null}); nav('splash', true); };
  },
};

/* ---------- boot ---------- */
history.replaceState({d:0}, '', location.hash || '#/splash');
if (!location.hash || location.hash === '#/' ) history.replaceState({d:0}, '', '#/splash');
render('fade');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
