<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Coral Sky · Recorrido de la app</title>
<style>
/*FONTS*/
:root{
  --cream:#F7EFE4; --cream-2:#EFE3D3; --sand:#E4D2BA; --paper:#FFFBF5;
  --coral:#DD7357; --coral-2:#EC9C82; --coral-soft:#F7DCD0; --coral-deep:#B9573F;
  --gold:#A27D47; --gold-2:#C9A66E; --gold-soft:#EBDDC6;
  --ink:#2E2219; --ink-2:#6E5D4E; --ink-3:#A8998A; --line:#E6D8C6;
  --sea:#8FBDB5; --good:#4E9A6B;
  --f-serif:"Cormorant Garamond",Georgia,serif; --f-caps:"Cinzel","Cormorant Garamond",serif; --f-ui:"Jost",system-ui,sans-serif; --f-script:"Great Vibes",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
body{font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#FBE4D6 0%,#F8EBDF 38%,#F7EFE4 62%,#EFE1CE 100%)}
svg{display:block}

/* ---------- stage decor ---------- */
.glow{position:absolute;left:50%;top:930px;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;background:radial-gradient(circle,rgba(236,156,130,.38) 0%,rgba(236,156,130,.12) 40%,transparent 68%);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.frond{position:absolute;width:520px;height:520px;opacity:.55;transform-origin:0 100%}
.frond.l{left:-120px;bottom:-60px;animation:sway 7s ease-in-out infinite}
.frond.r{right:-140px;top:-90px;transform:scaleX(-1) rotate(180deg);transform-origin:50% 50%;animation:sway2 8s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes sway2{0%,100%{transform:scaleX(-1) rotate(180deg)}50%{transform:scaleX(-1) rotate(184deg)}}
.spark{position:absolute;width:14px;height:14px;opacity:.8;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.2}}
.waves{position:absolute;left:0;right:0;bottom:70px;height:80px;opacity:.5}

/* ---------- captions ---------- */
#cap{position:absolute;left:0;right:0;top:118px;height:330px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;z-index:5}
#cap .num{font-family:var(--f-ui);font-weight:500;font-size:26px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
#cap .title{font-family:var(--f-serif);font-weight:600;font-size:92px;line-height:1;color:var(--ink);letter-spacing:-.01em}
#cap .title em{font-style:italic;color:var(--coral)}
#cap .sub{font-size:31px;color:var(--ink-2);max-width:820px;line-height:1.35}
#cap .w{display:inline-block;white-space:pre}

/* ---------- phone ---------- */
#phoneWrap{position:absolute;left:50%;top:476px;width:621px;height:1302px;margin-left:-310.5px;perspective:2200px;z-index:4}
#phone{position:absolute;inset:0;border-radius:96px;background:#17120E;padding:18px;box-shadow:0 0 0 3px #3a2f26,0 70px 120px -30px rgba(90,50,30,.45),0 30px 60px -20px rgba(90,50,30,.35);transform-style:preserve-3d}
#phone::after{content:"";position:absolute;inset:6px;border-radius:90px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);pointer-events:none}
#screen{position:relative;width:585px;height:1266px;border-radius:78px;overflow:hidden;background:var(--cream)}
#app{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(1.5);transform-origin:0 0;overflow:hidden;background:var(--cream)}
.island{position:absolute;top:16px;left:50%;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000;z-index:60;overflow:hidden;color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px}
.island .in{display:flex;align-items:center;gap:10px;width:100%;opacity:0}
.island .th{width:44px;height:44px;border-radius:13px;background:#3a2b20;display:grid;place-items:center;flex:none}
.island .th svg{width:90%}
.island .tx{flex:1;min-width:0;white-space:nowrap}
.island .tx b{display:block;font-size:13.5px;font-weight:600}
.island .tx span{display:block;font-size:11.5px;opacity:.65}
.island .go{height:30px;padding:0 12px;border-radius:15px;background:var(--coral);font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.sb{position:absolute;left:0;right:0;top:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font-weight:600;font-size:15px;z-index:55;pointer-events:none;color:var(--ink)}
.sb svg{height:11px;fill:currentColor}
.sb .ic{display:flex;gap:5px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.8;z-index:56}

/* ---------- finger ---------- */
#finger{position:absolute;left:0;top:0;width:0;height:0;z-index:30;pointer-events:none;opacity:0}
#finger .dot{position:absolute;left:-38px;top:-38px;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 10px 26px rgba(70,40,20,.35);backdrop-filter:blur(2px);transition:transform .14s ease}
#finger.down .dot{transform:scale(.78);background:rgba(255,255,255,.75)}
.ripple{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:4px solid rgba(255,255,255,.95);z-index:29;pointer-events:none}

/* ---------- progress ---------- */
#prog{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);display:flex;gap:10px;z-index:5;opacity:0}
#prog i{width:58px;height:6px;border-radius:3px;background:rgba(162,125,71,.25);overflow:hidden;position:relative}
#prog i b{position:absolute;inset:0;background:var(--coral);transform:scaleX(0);transform-origin:left}

/* ---------- intro / outro ---------- */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;pointer-events:none}
.hero .mark{width:420px;height:420px}
.mark svg{width:100%;height:100%}
.hero .wm{font-family:var(--f-caps);font-weight:500;font-size:112px;letter-spacing:.12em;color:#8A6A3D;margin-top:-6px;padding-left:.12em}
.hero .wm span{display:inline-block}
.hero .ew{display:flex;align-items:center;gap:22px;margin-top:6px;font-family:var(--f-ui);font-size:32px;letter-spacing:.55em;color:var(--gold);padding-left:.55em}
.hero .ew i{display:block;width:150px;height:2px;background:var(--gold);transform-origin:center}
.hero .tag{margin-top:70px;font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:64px;color:var(--ink);text-align:center;line-height:1.15}
.hero .tag b{font-weight:600;color:var(--coral)}
.hero .small{margin-top:26px;font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.hero .credit{position:absolute;bottom:120px;font-size:26px;color:var(--ink-2);letter-spacing:.06em}
.hero .credit b{color:var(--ink);font-weight:600}
.hsun{position:absolute;left:50%;top:960px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#F2A98F,#DD7357 70%);opacity:.0}
.hline{position:absolute;left:0;right:0;top:1200px;height:2px;background:var(--gold);opacity:0}

/* ================= APP ================= */
#app .scr{position:absolute;inset:0;background:var(--cream);overflow:hidden;display:flex;flex-direction:column}
#app .scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:50px}
#app .scroll::-webkit-scrollbar{display:none}
#app h1,#app h2{font-family:var(--f-serif);font-weight:600;letter-spacing:-.01em;line-height:1.05}
.pad{padding:0 22px}
.btn{height:54px;border-radius:27px;background:var(--coral);color:#fff;font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 12px 24px -12px var(--coral-deep);transition:transform .15s,background .3s}
.btn.dark{background:var(--ink);box-shadow:0 12px 24px -12px rgba(46,34,25,.6)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ok{background:var(--good)}
.pressed{transform:scale(.95)!important}
.btn svg,.ib svg{width:20px;height:20px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 4px 12px -6px rgba(90,60,30,.35);position:relative;flex:none;transition:transform .15s}
.ib .badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--coral);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid var(--cream);overflow:hidden}
.ib .badge[data-n="0"]{display:none}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* splash */
.splash{align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 40%,#FBE6DA,var(--cream) 70%)!important}
.splash .mark{width:190px;height:190px}
.splash .wm{font-family:var(--f-caps);font-size:38px;letter-spacing:.12em;color:#8A6A3D;padding-left:.12em}
.splash .ew{font-size:12px;letter-spacing:.55em;color:var(--gold);margin-top:6px;padding-left:.55em;display:flex;gap:10px;align-items:center}
.splash .ew i{width:50px;height:1px;background:var(--gold)}
.splash .bar{position:absolute;bottom:90px;width:90px;height:3px;border-radius:2px;background:var(--gold-soft);overflow:hidden}
.splash .bar i{display:block;height:100%;background:var(--coral);animation:load 1.6s ease-in-out both}
@keyframes load{from{width:0}to{width:100%}}

/* onboarding */
.onb .track{display:flex;width:300%;flex:1;padding-top:58px}
.onb .slide{width:33.333%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 30px;gap:14px}
.arch{width:300px;height:360px;border-radius:150px 150px 26px 26px;position:relative;overflow:hidden;display:grid;place-items:center}
.arch.a1{background:linear-gradient(180deg,#F6CDBE,#F3E0D1)}
.arch.a2{background:linear-gradient(180deg,#F8D9A8,#F4E6D2)}
.arch.a3{background:linear-gradient(180deg,#CFE3DD,#F1E8DB)}
.arch svg.art{position:absolute;inset:0;width:100%;height:100%}
.onb h2{font-size:36px;margin-top:18px}
.onb p{font-size:15.5px;line-height:1.5;color:var(--ink-2);max-width:300px}
.onb .dots{display:flex;gap:8px;justify-content:center;margin:18px 0 22px}
.onb .dots i{width:8px;height:8px;border-radius:4px;background:var(--sand);transition:all .4s}
.onb .dots i.on{width:26px;background:var(--coral)}
.onb .foot{display:flex;gap:14px;align-items:center;padding:0 22px 44px}
.onb .foot .skip{font-size:15px;color:var(--ink-2);font-weight:500;width:80px}

/* auth */
.auth .top{height:250px;position:relative;margin:-50px 0 0;overflow:hidden}
.auth .top svg{position:absolute;inset:0;width:100%;height:100%}
.auth h1{font-size:40px}
.auth .lead{font-size:15px;color:var(--ink-2);margin-top:6px}
.form{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.field{display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2);letter-spacing:.02em}
.field .box{height:52px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:16px;transition:box-shadow .25s}
.field .box svg{width:19px;height:19px;color:var(--ink-3);flex:none}
.field .val{flex:0 1 auto;white-space:nowrap;overflow:hidden}
.field .ph{color:var(--ink-3)}
.field .caret{width:1.5px;height:20px;background:var(--coral);display:none;animation:blink 1s steps(1) infinite;flex:none}
@keyframes blink{50%{opacity:0}}
.field.focus .box{box-shadow:inset 0 0 0 2px var(--coral),0 0 0 4px var(--coral-soft)}
.field.focus .caret{display:block}
.field.done .box{box-shadow:inset 0 0 0 1.5px var(--gold-2)}
.field .tick{margin-left:auto;color:var(--good);opacity:0}
.field.done .tick{opacity:1}
.strength{display:flex;gap:6px;margin-top:2px}
.strength i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.strength-l{font-size:12px;color:var(--ink-3);margin-top:-6px}
.check{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.check .cb{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--ink-3);display:grid;place-items:center;flex:none;transition:all .25s}
.check .cb svg{width:14px;height:14px;opacity:0;stroke:#fff;stroke-width:3}
.check.on .cb{background:var(--coral);box-shadow:none}
.check.on .cb svg{opacity:1}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.socials{display:flex;gap:12px}
.socials .btn{font-size:14.5px}
.foot-link{text-align:center;font-size:14.5px;color:var(--ink-2);margin:18px 0 30px}
.foot-link b{color:var(--coral);font-weight:600}
.forgot{align-self:flex-end;font-size:13px;color:var(--coral);font-weight:500;margin-top:-4px}

/* keyboard */
.kb{position:absolute;left:0;right:0;bottom:0;height:300px;background:#D7CCC0;padding:8px 4px 40px;display:flex;flex-direction:column;gap:11px;z-index:40;transform:translateY(100%)}
.kb .r{display:flex;gap:6px;justify-content:center}
.kb .k{height:42px;flex:0 0 33px;border-radius:6px;background:#FFFBF5;box-shadow:0 1px 0 rgba(0,0,0,.25);display:grid;place-items:center;font-size:20px;color:var(--ink);transition:background .1s,transform .1s}
.kb .k.w{flex:0 0 46px;background:#BFB2A4;font-size:14px}
.kb .k.sp{flex:1 1 auto;font-size:14px}
.kb .k.hit{background:#E9DCCB;transform:scale(1.12) translateY(-4px)}

/* home */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 22px 0}
.hdr .who{flex:1;min-width:0}
.hdr .who small{display:block;font-size:13px;color:var(--ink-2)}
.hdr .who h1{font-size:32px}
.search{margin:16px 22px 0;height:50px;border-radius:25px;background:var(--paper);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--ink-3);font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line)}
.search svg{width:19px;height:19px}
.promo{margin:18px 22px 0;height:170px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(120deg,#E58467,#F0AE8E 60%,#F6CDB0);color:#fff;padding:20px}
.promo .kick{font-size:11px;letter-spacing:.24em;font-weight:500;opacity:.92}
.promo h2{font-size:31px;margin-top:6px;color:#fff;max-width:56%}
.promo .chip{display:inline-flex;margin-top:12px;height:30px;padding:0 13px;border-radius:15px;background:rgba(255,255,255,.95);color:var(--coral-deep);font-size:12.5px;font-weight:600;align-items:center}
.promo svg.pg{position:absolute;right:-28px;bottom:6px;width:230px;transform:rotate(-10deg);filter:drop-shadow(0 10px 10px rgba(120,50,30,.35))}
.promo svg.pl{position:absolute;right:0;top:0;width:150px;height:170px;opacity:.5}
.cats{display:flex;gap:12px;padding:20px 22px 0}
.cat{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.cat .t{width:100%;aspect-ratio:1;border-radius:22px;background:var(--paper);display:grid;place-items:center;box-shadow:0 6px 16px -10px rgba(90,60,30,.45);transition:transform .15s,background .3s}
.cat .t svg{width:70%}
.cat.on .t{background:var(--coral-soft)}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:22px 22px 12px}
.sec h2{font-size:26px}
.sec a{font-size:13px;color:var(--coral);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 22px 120px}
.card{background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:0 8px 20px -14px rgba(90,60,30,.5);transition:transform .15s}
.card .im{height:128px;position:relative;display:grid;place-items:center}
.card .im svg.g{width:86%}
.card .fav{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;background:rgba(255,251,245,.9);display:grid;place-items:center;color:var(--ink-2)}
.card .fav svg{width:16px;height:16px}
.card .fav.on{color:var(--coral)}
.card .fav.on svg{fill:currentColor}
.card .sold{position:absolute;left:9px;top:9px;font-size:9.5px;letter-spacing:.12em;font-weight:600;color:#fff;background:var(--ink);padding:4px 8px;border-radius:8px}
.card .bd{padding:10px 13px 13px;position:relative}
.card .nm{font-family:var(--f-serif);font-size:21px;font-weight:600;line-height:1}
.card .tg{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.card .pr{font-weight:600;font-size:14.5px;margin-top:8px}
.card .add{position:absolute;right:11px;bottom:11px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transition:background .3s,transform .15s}
.card .add svg{width:16px;height:16px}
.card .add.ok{background:var(--good)}
.tabbar{position:absolute;left:14px;right:14px;bottom:24px;height:66px;border-radius:33px;background:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:20;box-shadow:0 18px 30px -16px rgba(46,34,25,.7)}
.tabbar .tb{display:grid;place-items:center;color:rgba(255,251,245,.55);height:66px;position:relative;z-index:1}
.tabbar .tb svg{width:23px;height:23px}
.tabbar .tb.on{color:var(--ink)}
.tabbar .pill{position:absolute;top:9px;left:0;width:72px;height:48px;border-radius:24px;background:var(--cream);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}

/* list */
.bar{display:flex;align-items:center;gap:12px;padding:4px 22px 0}
.bar h1{flex:1;font-size:30px}
.chips{display:flex;gap:8px;padding:16px 22px 4px}
.chips .c{height:36px;padding:0 16px;border-radius:18px;display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);transition:all .3s}
.chips .c.on{background:var(--ink);color:#fff;box-shadow:none}
.count{font-size:13px;color:var(--ink-3);padding:6px 22px 12px}

/* product */
.pd .hero2{height:380px;position:relative;overflow:hidden;margin-top:-50px}
.pd .hero2 .bgarch{position:absolute;left:50%;top:70px;width:290px;height:330px;margin-left:-145px;border-radius:145px 145px 0 0;transition:background .5s}
.pd .ptrack{position:absolute;inset:0;display:flex}
.pd .pslide{flex:0 0 100%;display:grid;place-items:center;padding:110px 34px 40px}
.pd .pslide svg{width:100%;filter:drop-shadow(0 22px 16px rgba(90,50,30,.28))}
.pd .float{position:absolute;top:56px;left:18px;right:18px;display:flex;gap:10px;z-index:5}
.pd .float .sp{flex:1}
.pd .pdots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.pd .pdots i{width:6px;height:6px;border-radius:3px;background:rgba(46,34,25,.25);transition:all .4s}
.pd .pdots i.on{width:20px;background:var(--ink)}
.pd .sheet{background:var(--paper);border-radius:30px 30px 0 0;margin-top:-22px;position:relative;padding:24px 22px 130px;flex:1;display:flex;flex-direction:column;gap:12px}
.pd .sheet h1{font-size:42px}
.pd .row{display:flex;align-items:center;justify-content:space-between}
.pd .stars{display:flex;gap:3px;align-items:center;font-size:13px;color:var(--ink-2)}
.pd .stars svg{width:15px;height:15px;fill:var(--gold-2);stroke:none}
.pd .price{font-family:var(--f-serif);font-size:30px;font-weight:700}
.pd .lbl{font-size:13px;color:var(--ink-2)}
.pd .lbl b{color:var(--ink);font-weight:600}
.sw{display:flex;gap:12px}
.sw i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--paper),0 0 0 1.5px var(--line);transition:box-shadow .3s}
.sw i.on{box-shadow:inset 0 0 0 3px var(--paper),0 0 0 2px var(--ink)}
.feats{display:flex;gap:10px}
.feats div{flex:1;border-radius:16px;background:var(--cream);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2);text-align:center}
.feats svg{width:22px;height:22px;color:var(--coral)}

async function go(name, how = 'push', params = {}){
  const el = document.createElement('div'); el.innerHTML = SCREENS[name](params); const scr = el.firstElementChild; scr.dataset.name = name;
  app.appendChild(scr);
  const old = cur; cur = scr;
  if (old && how !== 'none') sfx('whoosh');
  const jobs = [];
  if (!old || how === 'none') {}
  else if (how === 'push') { jobs.push(done(A(scr,[{transform:'translateX(100%)'},{transform:'none'}],'push')), done(A(old,[{transform:'none',filter:'brightness(1)'},{transform:'translateX(-30%)',filter:'brightness(.9)'}],'push'))); }
  else if (how === 'back') { app.insertBefore(scr, old); jobs.push(done(A(scr,[{transform:'translateX(-30%)'},{transform:'none'}],'push')), done(A(old,[{transform:'none'},{transform:'translateX(100%)'}],'push'))); }
  else if (how === 'fade') { jobs.push(done(A(scr,[{opacity:0,transform:'scale(1.04)'},{opacity:1,transform:'none'}],'soft')), done(A(old,[{opacity:1},{opacity:0}],{duration:300}))); }

}
